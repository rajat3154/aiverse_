[project]
name = "aiverse-logging"
version = "0.1.0"
description = "Shared structured logging and OpenTelemetry integration for AIVERSE"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30.0"
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"