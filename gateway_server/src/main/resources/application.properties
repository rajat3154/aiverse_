
# Application
spring.application.name=gateway
server.port=${PORT:8080}
spring.config.import=optional:file:.env[.properties]

# Backend URLs
aiverse.spring.server=${SPRING_SERVER_URL:http://localhost:8081}
aiverse.ai.server=${AI_SERVER_URL:http://localhost:8000}
aiverse.flowable.server=${FLOWABLE_SERVER_URL:http://localhost:8082}

# Spring Server Route
spring.cloud.gateway.server.webmvc.routes[0].id=spring-server
spring.cloud.gateway.server.webmvc.routes[0].uri=${aiverse.spring.server}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/identity/**
spring.cloud.gateway.server.webmvc.routes[0].filters[0]=StripPrefix=3

# AI Server Route
spring.cloud.gateway.server.webmvc.routes[1].id=ai-server
spring.cloud.gateway.server.webmvc.routes[1].uri=${aiverse.ai.server}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/ai/**
spring.cloud.gateway.server.webmvc.routes[1].filters[0]=StripPrefix=3

# Flowable Server Route
spring.cloud.gateway.server.webmvc.routes[2].id=flowable-server
spring.cloud.gateway.server.webmvc.routes[2].uri=${aiverse.flowable.server}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/workflows/**
spring.cloud.gateway.server.webmvc.routes[2].filters[0]=StripPrefix=3

# Frontend CORS
aiverse.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origins=${aiverse.frontend.origin}
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webmvc.globalcors.add-to-simple-url-handler-mapping=true

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoints.web.cors.allowed-origins=${aiverse.frontend.origin}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.connect-timeout=${REDIS_SOCKET_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${REDIS_SOCKET_TIMEOUT:5s}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_MAX_CONNECTIONS:20}
spring.data.redis.lettuce.pool.max-idle=${REDIS_MAX_IDLE:10}
spring.data.redis.lettuce.pool.min-idle=${REDIS_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_MAX_WAIT:5s}

aiverse.redis.enabled=${REDIS_ENABLED:true}
aiverse.redis.key-prefix=${REDIS_KEY_PREFIX:aiverse:gateway}