services:
  - type: web
    name: aiverse-gateway
    runtime: docker
    dockerfilePath: ./gateway_server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_SERVER_URL
        sync: false
      - key: AI_SERVER_URL
        sync: false
      - key: FLOWABLE_SERVER_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_MAX_POOL_SIZE
        value: "5"
      - key: REDIS_URL
        sync: false
      - key: REDIS_KEY_PREFIX
        value: aiverse:gateway
      - key: JWT_SECRET
        sync: false
      - key: JWT_ACCESS_TOKEN_EXPIRATION
        value: "900000"
      - key: JWT_REFRESH_TOKEN_EXPIRATION
        value: "604800000"
      - key: API_KEY_SECRET
        sync: false
      # Any profile other than default/local switches logback to JSON + Grafana OTLP export (see logback-spring.xml).
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: OTEL_SERVICE_NAME
        value: gateway_server
      - key: OTEL_SERVICE_NAMESPACE
        value: aiverse
      - key: OTEL_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: AIVERSE_SERVICE_VERSION
        value: 0.1.0
      - key: GRAFANA_OTLP_ENDPOINT
        sync: false
      - key: GRAFANA_OTLP_USERNAME
        sync: false
      - key: GRAFANA_OTLP_TOKEN
        sync: false
