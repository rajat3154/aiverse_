services:
  - type: web
    name: aiverse-gateway
    runtime: docker
    dockerfilePath: ./gateway_server/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_SERVER_URL
        sync: false
      - key: AI_SERVER_URL
        sync: false
      - key: FLOWABLE_SERVER_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: OTEL_SERVICE_NAME
        value: gateway_server
      - key: OTEL_SERVICE_NAMESPACE
        value: aiverse
      - key: OTEL_DEPLOYMENT_ENVIRONMENT
        value: production
      - key: AIVERSE_SERVICE_VERSION
        value: 0.1.0
      - key: GRAFANA_OTLP_ENDPOINT
        sync: false
      - key: GRAFANA_OTLP_USERNAME
        sync: false
      - key: GRAFANA_OTLP_TOKEN
        sync: false
