spring.application.name=flowable
server.port=${PORT:8082}
log4j.rootLogger=DEBUG, CA

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

flowable.database-schema-update=true
flowable.async-executor-activate=true

spring.config.import=optional:file:.env[.properties]


log4j.appender.CA=org.apache.log4j.ConsoleAppender
log4j.appender.CA.layout=org.apache.log4j.PatternLayout
log4j.appender.CA.layout.ConversionPattern= %d{hh:mm:ss,SSS} [%t] %-5p %c %x - %m%n


# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.connect-timeout=${REDIS_SOCKET_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${REDIS_SOCKET_TIMEOUT:5s}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_MAX_CONNECTIONS:20}
spring.data.redis.lettuce.pool.max-idle=${REDIS_MAX_IDLE:10}
spring.data.redis.lettuce.pool.min-idle=${REDIS_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_MAX_WAIT:5s}

aiverse.redis.enabled=${REDIS_ENABLED:true}
aiverse.redis.key-prefix=${REDIS_KEY_PREFIX:aiverse:flowable}