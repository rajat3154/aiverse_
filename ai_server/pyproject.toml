[project]
name = "ai-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aio-pika",
    "aiverse-logging",
    "asyncpg",
    "fastapi>=0.162.0",
    "grpcio",
    "grpcio-tools",
    "protobuf",
    "python-dotenv>=1.2.4",
    "sse-starlette",
    "python-socketio",
    "cloudinary",
    "python-multipart",
    "sqlalchemy[asyncio]",
    "uvicorn>=0.54.0",
    "redis>=8.1.0",
    "jsonschema>=4.26.0",
    "langchain-openai>=1.7.4",
    "langchain-anthropic",
    "langchain-groq",
    "langchain-google-genai",
    "langchain-sarvam",
    "langchain-nvidia-ai-endpoints",
    "langchain-youtube>=0.2.0",
    "composio>=0.32,<0.33",
    "cryptography",
    "pymysql",
    "pymongo",
    "oracledb",
]

[tool.uv.sources]
aiverse-logging = { path = "../logging/python" }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
