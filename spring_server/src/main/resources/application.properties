spring.application.name=AIVERSE
aiverse.environment=${AIVERSE_ENVIRONMENT:development}
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}      
# Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
# RabbitMQ
spring.rabbitmq.addresses=${RABBITMQ_URL}
spring.rabbitmq.listener.simple.prefetch=${RABBITMQ_PREFETCH_COUNT:10}
aiverse.rabbitmq.exchange=${RABBITMQ_EXCHANGE:aiverse}
aiverse.rabbitmq.request-queue=${RABBITMQ_REQUEST_QUEUE:aiverse.ai.requests}
aiverse.rabbitmq.response-queue=${RABBITMQ_RESPONSE_QUEUE:aiverse.ai.responses}
# gRPC
aiverse.grpc.server.port=${GRPC_PORT:9090}
aiverse.grpc.client.host=${GRPC_CLIENT_HOST:localhost}
aiverse.grpc.client.port=${GRPC_CLIENT_PORT:50051}

logging.level.io.grpc.netty.shaded.io.grpc.netty.NettyServerTransport=WARN

aiverse.socketio.hostname=${SOCKETIO_HOSTNAME:0.0.0.0}
aiverse.socketio.port=${SOCKETIO_PORT:9092}
aiverse.socketio.origin=${SOCKETIO_ORIGIN:http://localhost:5173}

aiverse.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:*}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:10MB}


# Redis Configuration
spring.data.redis.url=${REDIS_URL:redis://localhost:6379/0}
spring.data.redis.connect-timeout=${REDIS_SOCKET_CONNECT_TIMEOUT:5s}
spring.data.redis.timeout=${REDIS_SOCKET_TIMEOUT:5s}
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=${REDIS_MAX_CONNECTIONS:20}
spring.data.redis.lettuce.pool.max-idle=${REDIS_MAX_IDLE:10}
spring.data.redis.lettuce.pool.min-idle=${REDIS_MIN_IDLE:2}
spring.data.redis.lettuce.pool.max-wait=${REDIS_MAX_WAIT:5s}

# AIVERSE Redis Namespace
aiverse.redis.enabled=${REDIS_ENABLED:true}
aiverse.redis.key-prefix=${REDIS_KEY_PREFIX:aiverse:spring}

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.drop-first=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
aiverse.security.api-key-secret=${API_KEY_ENCRYPTION_SECRET}

aiverse.security.credentials-encryption-secret=${CREDENTIALS_ENCRYPTION_SECRET}


aiverse.master.bootstrap-token=${MASTER_BOOTSTRAP_TOKEN:}


aiverse.master.seed-first-name=${MASTER_SEED_FIRST_NAME:}
aiverse.master.seed-last-name=${MASTER_SEED_LAST_NAME:}
aiverse.master.seed-email=${MASTER_SEED_EMAIL:}
aiverse.master.seed-username=${MASTER_SEED_USERNAME:}
aiverse.master.seed-password=${MASTER_SEED_PASSWORD:}

aiverse.ai.server-url=${AI_SERVER_URL:http://localhost:8000}
aiverse.ai.internal-token=${AI_INTERNAL_TOKEN:}
