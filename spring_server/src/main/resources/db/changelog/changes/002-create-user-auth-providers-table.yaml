databaseChangeLog:
  - changeSet:
      id: 002-create-user-auth-providers-table
      author: aiverse
      changes:
        - createTable:
            tableName: user_auth_providers
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(30), constraints: { nullable: false } }
              - column: { name: provider_user_id, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: provider_email, type: VARCHAR(255) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: user_auth_providers
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: tenant_id
            constraintName: fk_auth_provider_user
            onDelete: CASCADE
        # one identity per provider per user, and one AIVERSE user per provider identity
        - addUniqueConstraint:
            tableName: user_auth_providers
            columnNames: user_id, provider
            constraintName: uk_auth_provider_user
        - addUniqueConstraint:
            tableName: user_auth_providers
            columnNames: provider, provider_user_id
            constraintName: uk_auth_provider_external_id
