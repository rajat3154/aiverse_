databaseChangeLog:
  - changeSet:
      id: 004-create-credentials-table
      author: aiverse
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: UUID, constraints: { nullable: false } }
              - column: { name: name, type: VARCHAR(150), constraints: { nullable: false } }
              - column: { name: type, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: provider, type: VARCHAR(100) }
              - column: { name: identifier, type: VARCHAR(50) }
              - column: { name: secret, type: TEXT, constraints: { nullable: false } }
              - column: { name: storage_type, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: metadata, type: JSONB }
              - column: { name: status, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: last_used_at, type: TIMESTAMP WITH TIME ZONE }
        - addForeignKeyConstraint:
            baseTableName: credentials
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: tenant_id
            constraintName: fk_credentials_user
            onDelete: CASCADE
        - addUniqueConstraint:
            tableName: credentials
            columnNames: user_id, name
            constraintName: uk_credentials_user_name
