
databaseChangeLog:
  - changeSet:
      id: 001-create-llm-provider-catalog
      author: aiverse
      changes:
        - createTable:
            tableName: llm_provider_catalog
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_llm_provider_catalog
                    nullable: false
              - column:
                  name: provider_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_llm_provider_catalog_key
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_llm_provider_catalog_slug
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: category
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: manifest_version
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: manifest_hash
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: manifest
                  type: JSONB
                  constraints:
                    nullable: false
              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: llm_provider_catalog
            indexName: idx_llm_provider_catalog_enabled
            columns:
              - column:
                  name: enabled
        - createIndex:
            tableName: llm_provider_catalog
            indexName: idx_llm_provider_catalog_category
            columns:
              - column:
                  name: category
      rollback:
        - dropTable:
            tableName: llm_provider_catalog
